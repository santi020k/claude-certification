name: Bug report
description: Report a reproducible problem in the certification project.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please do not include API keys, tokens, or private conversation data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest set of steps that reproduces the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, Node.js version, Python version, and operating system.
    validations:
      required: true
